name: lumi-three-switch-decouple
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: legendabsolute60149.switchAllOnOff1
    version: 1
  - id: legendabsolute60149.signalMetrics
    version: 1
  - id: refresh
    version: 1
  - id: firmwareUpdate
    version: 1
  categories:
  - name: Switch
- id: switch2
  capabilities:
  - id: switch
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Switch
- id: switch3
  capabilities:
  - id: switch
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Switch
preferences:
  - name: "version"
    title: "Version 4.7 (Custom Decouple)"
    description: "Added: Decoupling Options for Each Switch" 
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 0
      default: ""
  - name: "decoupleSwitch1"
    title: "Decouple Switch 1"
    description: "Enable/Disable Decoupling for Switch 1 (separate physical button from relay control)"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "1": "Coupled (Normal Mode)"
        "0": "Decoupled (Button Independent)"
      default: "1"
  - name: "decoupleSwitch2"
    title: "Decouple Switch 2"
    description: "Enable/Disable Decoupling for Switch 2 (separate physical button from relay control)"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "1": "Coupled (Normal Mode)"
        "0": "Decoupled (Button Independent)"
      default: "1"
  - name: "decoupleSwitch3"
    title: "Decouple Switch 3"
    description: "Enable/Disable Decoupling for Switch 3 (separate physical button from relay control)"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "1": "Coupled (Normal Mode)"
        "0": "Decoupled (Button Independent)"
      default: "1"
  - name: "onOffReports"
    title: "Device On-Off Interval Report"
    description: "Set Device Interval Report (300 to 1200 sec). Smartthings Default = 300."
    required: true
    preferenceType: integer
    definition:
      minimum: 300
      maximum: 1200
      default: 300
  - name: "restoreState"
    title: "Restore State After Power Lost"
    description: "After the power supply is back on, the State can be restored to previous state or remain switched off"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "0": "device remains switched Off"
        "1": "device remains switched On"
        "255": "device restores previous state"
      default: "255"
  - name: "signalMetricsVisibles"
    title: "Signal Metrics Visible in History"
    description: "Signal Metrics Visible in App History:"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "Yes" : "Signal Metrics Visible"
        "No": "Signal Metrics No Visible"
      default: "No"
  - name: "switch1Child"
    title: "Single Device to Action All On-Off"
    description: "Create Single Device to Action All On-Off Switch:"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "Yes" : "Create Single Device"
        "No": "No Create Single Device"
      default: "No"
  - name: "switch2Child"
    title: "Create Single Device for Switch2"
    description: "Create Single Device for Switch2:"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "Yes" : "Create Single Device"
        "No": "No Create Single Device"
      default: "No"
  - name: "switch3Child"
    title: "Create Single Device for Switch3"
    description: "Create Single Device for Switch3:"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "Yes" : "Create Single Device"
        "No": "No Create Single Device"
      default: "No"
  - name: "logDebugPrint"
    title: "Show Logs Debug Prints in CLI"
    required: false
    preferenceType: boolean
    definition:
      default: false
metadata:
  deviceType: Switch
  ocfDeviceType: oic.d.switch
  deviceTypeId: Switch